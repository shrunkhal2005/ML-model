<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Health Lifestyle Prediction</title>
    <style>
      :root{--bg:#0f1724;--card:#0b1220;--muted:#9aa4b2;--accent:#2563eb;--danger:#ef4444;--success:#10b981}
      body{font-family:Inter,Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#071027,#0f1724);color:#e6eef8;margin:0;padding:28px}
      .card{max-width:980px;margin:28px auto;padding:28px;background:var(--card);border-radius:14px;box-shadow:0 12px 40px rgba(2,6,23,.6)}
      .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
      label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
      input,select{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.04);background:rgba(255,255,255,.03);color:inherit}
      .controls{text-align:right;margin-top:16px}
      button{background:var(--accent);color:#fff;padding:10px 16px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
      #result{margin-top:18px;padding:14px;border-radius:10px;background:rgba(255,255,255,.02);min-height:48px}
      .badge{display:inline-block;padding:6px 10px;border-radius:999px;font-weight:700}
      .result-high{background:rgba(239,68,68,.12);color:var(--danger)}
      .result-low{background:rgba(16,185,129,.06);color:var(--success)}
      .metrics{margin-top:8px;color:var(--muted);font-size:13px}
      .loading{display:inline-block;width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.08);border-top-color:var(--accent);animation:spin 1s linear infinite;vertical-align:middle}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Health Lifestyle Disease Prediction</h1>
      <p>Fill the form and click Predict. Backend powered by FastAPI.</p>

      <div class="grid">
        <div>
          <label>Age</label>
          <input id="age" type="number" value="35" />
        </div>
        <div>
          <label>Gender</label>
          <select id="gender"><option>male</option><option>female</option></select>
        </div>
        <div>
          <label>BMI</label>
          <input id="bmi" type="number" value="24.5" />
        </div>
        <div>
          <label>Daily Steps</label>
          <input id="daily_steps" type="number" value="6000" />
        </div>
        <div>
          <label>Sleep Hours</label>
          <input id="sleep_hours" type="number" value="7" />
        </div>
        <div>
          <label>Water Intake (L)</label>
          <input id="water_intake_l" type="number" value="2" />
        </div>
        <div>
          <label>Calories Consumed</label>
          <input id="calories_consumed" type="number" value="2200" />
        </div>
        <div>
          <label>Smoker (0/1)</label>
          <input id="smoker" type="number" value="0" />
        </div>
        <div>
          <label>Alcohol (0/1)</label>
          <input id="alcohol" type="number" value="0" />
        </div>
        <div>
          <label>Resting HR</label>
          <input id="resting_hr" type="number" value="70" />
        </div>
        <div>
          <label>Systolic BP</label>
          <input id="systolic_bp" type="number" value="120" />
        </div>
        <div>
          <label>Diastolic BP</label>
          <input id="diastolic_bp" type="number" value="80" />
        </div>
        <div>
          <label>Cholesterol</label>
          <input id="cholesterol" type="number" value="180" />
        </div>
        <div>
          <label>Family History (0/1)</label>
          <input id="family_history" type="number" value="0" />
        </div>
      </div>

      <div class="controls">
        <button id="predict">Predict</button>
      </div>

      <div id="result">
        <div id="result-badge"></div>
        <div id="result-prob"></div>
        <div id="result-metrics" class="metrics"></div>
      </div>
    </div>

    <script>
      // Resolve API base at runtime by reading frontend/api_base.txt (if present).
      // Fallbacks: when running locally use http://127.0.0.1:8000, otherwise use empty (relative) unless api_base.txt contains a URL.
      let apiBase = '';
      if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
        apiBase = 'http://127.0.0.1:8000';
      }

      // Try to read optional api_base.txt in frontend folder to override API base for production.
      try {
        fetch('api_base.txt', {cache: 'no-store'}).then(r => r.text()).then(t => {
          const s = t.trim();
          if (s.length) apiBase = s;
        }).catch(()=>{/*ignore*/});
      } catch (e) {}

      const btn = document.getElementById('predict');
      btn.onclick = async () => {
        const data = {
          age: parseFloat(document.getElementById('age').value),
          gender: document.getElementById('gender').value,
          bmi: parseFloat(document.getElementById('bmi').value),
          daily_steps: parseFloat(document.getElementById('daily_steps').value),
          sleep_hours: parseFloat(document.getElementById('sleep_hours').value),
          water_intake_l: parseFloat(document.getElementById('water_intake_l').value),
          calories_consumed: parseFloat(document.getElementById('calories_consumed').value),
          smoker: parseInt(document.getElementById('smoker').value)||0,
          alcohol: parseInt(document.getElementById('alcohol').value)||0,
          resting_hr: parseFloat(document.getElementById('resting_hr').value),
          systolic_bp: parseFloat(document.getElementById('systolic_bp').value),
          diastolic_bp: parseFloat(document.getElementById('diastolic_bp').value),
          cholesterol: parseFloat(document.getElementById('cholesterol').value),
          family_history: parseInt(document.getElementById('family_history').value)||0
        };

        const resultBadge = document.getElementById('result-badge');
        const resultProb = document.getElementById('result-prob');
        const resultMetrics = document.getElementById('result-metrics');

        resultBadge.innerHTML = '<span class="loading"></span> Calling backend...';
        resultProb.innerText = '';
        resultMetrics.innerText = '';
        btn.disabled = true;
        try {
          const res = await fetch((apiBase || '') + '/predict', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(data)
          });
          if (!res.ok) {
            const err = await res.text();
            throw new Error(err || res.statusText);
          }
          const j = await res.json();
          const isHigh = (j.prediction === 1) || (j.result && j.result.toLowerCase().includes('high'));
          resultBadge.innerHTML = `<span class="badge ${isHigh? 'result-high':'result-low'}">${j.result}</span>`;
          if (j.probability !== null && j.probability !== undefined) {
            resultProb.innerHTML = `<strong>Confidence:</strong> ${(j.probability*100).toFixed(1)}%`;
          }
          if (j.metrics) {
            resultMetrics.innerText = `Model acc: ${ (j.metrics.acc||0).toFixed(3) }   F1 (high risk): ${ (j.metrics.f1_high_risk||0).toFixed(3) }`;
          }
        } catch(e){
          resultBadge.innerHTML = `<span class="badge" style="background:rgba(255,0,0,.06);color:var(--danger)">Error</span>`;
          resultProb.innerText = 'Error: '+ (e.message||e);
        } finally {
          btn.disabled = false;
        }
      };
    </script>
  </body>
</html>
